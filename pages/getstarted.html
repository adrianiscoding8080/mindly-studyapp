<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started | Mindly</title>
  
  <!-- Google Fonts & Tailwind CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { background-color: #080811; font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-panel {
      background: rgba(18, 20, 38, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Glow -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] h-[450px] bg-indigo-500/20 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- Signup Card -->
  <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative z-10 space-y-6">
    <div class="text-center">
      <a href="index.html" class="text-2xl font-black text-white tracking-tight">
        Mindly<span class="text-indigo-500">.</span>
      </a>
      <h1 class="text-2xl font-extrabold text-white mt-3">Create Your Account</h1>
      <p class="text-slate-400 text-sm mt-1">Join thousands of scholars mastering subjects effortlessly.</p>
    </div>

    <form class="space-y-4" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Full Name</label>
        <input type="text" placeholder="Alex Scholar" required class="w-full bg-[#080811] border border-white/10 rounded-xl p-3.5 text-slate-200 text-sm focus:outline-none focus:border-indigo-500 transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Email Address</label>
        <input type="email" placeholder="alex@example.com" required class="w-full bg-[#080811] border border-white/10 rounded-xl p-3.5 text-slate-200 text-sm focus:outline-none focus:border-indigo-500 transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Password</label>
        <input type="password" placeholder="••••••••" required class="w-full bg-[#080811] border border-white/10 rounded-xl p-3.5 text-slate-200 text-sm focus:outline-none focus:border-indigo-500 transition">
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-95 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-500/25 transition">
        Create Free Account 🚀
      </button>
    </form>

    <div class="text-center text-xs text-slate-400 pt-2">
      Already have an account? <a href="login.html" class="text-indigo-400 font-semibold hover:underline">Log In</a>
    </div>
  </div>

</body>
</html>
