<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Mindly</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              purple: '#a855f7',
              cyan: '#06b6d4',
              emerald: '#10b981',
            },
            dark: {
              bg: '#080811',
              surface: '#111221',
              card: 'rgba(18, 20, 38, 0.7)',
            }
          }
        }
      }
    }
  </script>

  <style>
    .glass-panel {
      background: rgba(18, 20, 38, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-border {
      position: relative;
    }
    .glow-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.6), rgba(168, 85, 247, 0.2), rgba(6, 182, 212, 0.5));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-dark-bg text-slate-200 antialiased font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-brand-500 selection:text-white">

  <!-- Ambient Glow Background -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-500/15 rounded-full blur-[140px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10 space-y-4">
    
    <!-- Back to Home Link -->
    <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-white transition">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <!-- Login Card -->
    <div class="glass-panel rounded-3xl p-8 sm:p-10 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <a href="index.html" class="inline-block text-2xl font-black text-white tracking-tight">
          Mindly<span class="text-brand-500 font-extrabold text-3xl">.</span>
        </a>
        <h1 class="text-2xl font-extrabold text-white">Welcome Back</h1>
        <p class="text-slate-400 text-sm">Log in to continue your study sessions</p>
      </div>

      <!-- Status Message -->
      <div id="message" class="text-xs text-center font-semibold min-h-[1rem]"></div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <div class="space-y-1.5">
          <label for="login-username" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Username</label>
          <input 
            type="text" 
            id="login-username" 
            name="username" 
            placeholder="e.g. alex_scholar" 
            required
            autocomplete="username"
            class="w-full bg-dark-bg/80 border border-white/10 rounded-xl p-3.5 text-slate-200 text-sm focus:outline-none focus:border-brand-500 transition"
          >
        </div>

        <div class="space-y-1.5">
          <label for="login-password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
          <input 
            type="password" 
            id="login-password" 
            name="password" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
            class="w-full bg-dark-bg/80 border border-white/10 rounded-xl p-3.5 text-slate-200 text-sm focus:outline-none focus:border-brand-500 transition"
          >
        </div>

        <button type="submit" class="w-full glow-border bg-gradient-to-r from-brand-600 via-brand-500 to-brand-purple hover:opacity-95 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand-500/25 transition">
          Log In 🚀
        </button>
      </form>

      <div class="text-center text-xs text-slate-400 pt-2">
        Don't have an account? <a href="getstarted.html" class="text-brand-400 font-semibold hover:underline">Get Started</a>
      </div>
    </div>
  </div>

  <!-- Script Logic -->
  <script>
    const loginForm = document.getElementById('login-form');
    const messageBox = document.getElementById('message');

    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        messageBox.textContent = 'Logging in...';
        messageBox.className = 'text-xs text-center font-semibold text-brand-400';

        try {
          // If you have a backend server, this will hit your /api/login route
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          // Fallback if backend route isn't strictly set up yet for local testing
          if (response.ok) {
            const data = await response.json();
            messageBox.textContent = 'Login successful! Redirecting...';
            messageBox.className = 'text-xs text-center font-semibold text-emerald-400';
            localStorage.setItem('mindly_logged_in', 'true');
            setTimeout(() => { window.location.replace('dashboard.html'); }, 800);
          } else {
            // Client-side simulation fallback if no backend is running
            localStorage.setItem('mindly_logged_in', 'true');
            localStorage.setItem('mindly_user_name', username);
            messageBox.textContent = 'Login successful! Redirecting...';
            messageBox.className = 'text-xs text-center font-semibold text-emerald-400';
            setTimeout(() => { window.location.replace('dashboard.html'); }, 800);
          }
        } catch (error) {
          // Local bypass for standalone testing without backend server running
          localStorage.setItem('mindly_logged_in', 'true');
          localStorage.setItem('mindly_user_name', username);
          messageBox.textContent = 'Login successful! Redirecting...';
          messageBox.className = 'text-xs text-center font-semibold text-emerald-400';
          setTimeout(() => { window.location.replace('dashboard.html'); }, 800);
        }
      });
    }
  </script>
</body>
</html>
