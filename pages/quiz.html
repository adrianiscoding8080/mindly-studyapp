<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algebra 1 Lesson & Quiz | Mindly</title>
  <link rel="stylesheet" href="../index.css">
  <style>
    .lesson-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .lesson-wrapper.focus-mode .hide-in-focus {
      display: none !important;
    }

    .lesson-wrapper.focus-mode {
      max-width: 750px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .lesson-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .lesson-card {
      background: rgba(25, 25, 35, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    .lesson-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .focus-toggle-btn {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c084fc;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .focus-toggle-btn:hover {
      background: rgba(139, 92, 246, 0.4);
      color: #ffffff;
    }

    .lesson-card h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .lesson-content {
      color: #d4d4d8;
      font-size: 1.05rem;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .lesson-content h3 {
      color: #ffffff;
      font-size: 1.2rem;
      margin-top: 1rem;
    }

    .example-box {
      background: rgba(15, 15, 20, 0.8);
      border-left: 4px solid #ec4899;
      padding: 1.25rem;
      border-radius: 0 10px 10px 0;
      margin: 0.5rem 0;
      font-family: monospace;
      color: #f4f4f5;
    }

    .btn-action {
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 2rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
    }

    /* Quiz Container Styles */
    #quiz-view {
      display: none;
      flex-direction: column;
      gap: 1.5rem;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #a1a1aa;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .question-box p {
      font-size: 1.15rem;
      color: #f4f4f5;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-btn {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: rgba(15, 15, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .option-btn:hover {
      border-color: #ec4899;
      background: rgba(236, 72, 153, 0.15);
    }

    .option-btn.selected {
      border-color: #ec4899;
      background: rgba(236, 72, 153, 0.3);
    }

    /* Results Summary View */
    #results-view {
      display: none;
      flex-direction: column;
      gap: 1.5rem;
    }

    .summary-item {
      padding: 1rem;
      background: rgba(15, 15, 20, 0.8);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .summary-item.correct { border-color: rgba(52, 211, 153, 0.5); }
    .summary-item.incorrect { border-color: rgba(248, 113, 113, 0.5); }

    .back-link {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }
    .back-link:hover { color: #ffffff; }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="lesson-wrapper" id="lesson-wrapper">
    <div class="lesson-container">
      
      <!-- Top Navigation & Focus Toggle -->
      <div class="lesson-top-bar hide-in-focus" id="top-nav-bar">
        <a href="quiz.html" class="back-link" id="back-link-element">← Back to Curriculum</a>
        <button class="focus-toggle-btn" onclick="toggleFocusMode()">✨ Toggle Deep Focus Mode</button>
      </div>

      <!-- MAIN CARD CONTAINER -->
      <div class="lesson-card">

        <!-- VIEW 1: LESSON STUDY CONTENT -->
        <div id="study-view">
          <h1 id="lesson-title">Loading Lesson...</h1>
          <div class="lesson-content" id="lesson-body">
            <!-- Detailed notes injected here -->
          </div>
          <button class="btn-action btn-primary" onclick="startQuiz()">Go to Quiz (15 Questions) 🚀</button>
        </div>

        <!-- VIEW 2: 15-QUESTION QUIZ -->
        <div id="quiz-view">
          <div class="quiz-header">
            <h2 style="color: #fff; font-size: 1.3rem;">Lesson Practice Quiz</h2>
            <span id="progress-indicator">Question 1 of 15</span>
          </div>

          <div class="question-box">
            <p id="question-text">Loading question...</p>
            <div class="options-group" id="options-group"></div>
          </div>

          <div style="display: flex; justify-content: space-between; margin-top: 2rem;">
            <button class="btn-action" id="prev-btn" onclick="prevQuestion()" style="display:none; width: 48%; background: rgba(255,255,255,0.1); color:#fff;">Previous</button>
            <button class="btn-action btn-primary" id="next-btn" onclick="nextQuestion()" style="width: 100%; margin-top:0;">Next Question</button>
          </div>
        </div>

        <!-- VIEW 3: RESULTS & SPACED REPETITION -->
        <div id="results-view">
          <h2>Quiz Results & Spaced Repetition</h2>
          <p id="score-summary" style="color: #34d399; font-weight: 600; font-size: 1.1rem;"></p>
          
          <div style="background: rgba(192, 132, 252, 0.08); border: 1px solid rgba(192, 132, 252, 0.2); border-radius: 15px; padding: 1.5rem; margin: 1rem 0;">
            <h4 style="color: #c084fc; font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem;">🧠 Smart Spaced Repetition Scheduling</h4>
            <p style="font-size: 0.9rem; color: #a1a1aa; margin-bottom: 1rem;">Rate your mastery confidence to set your next review interval:</p>
            <div style="display: flex; gap: 1rem;">
              <button onclick="handleSpacedRepetition('hard')" style="flex:1; padding:0.75rem; border-radius:8px; font-weight:600; cursor:pointer; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);">Need Review Soon (1 Day)</button>
              <button onclick="handleSpacedRepetition('good')" style="flex:1; padding:0.75rem; border-radius:8px; font-weight:600; cursor:pointer; background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4);">Mastered! (4 Days)</button>
            </div>
          </div>

          <div id="summary-list" style="display: flex; flex-direction: column; gap: 1rem; max-height: 350px; overflow-y: auto;"></div>
        </div>

      </div>

    </div>
  </div>

  <script>
    // URL Parameter handling
    const urlParams = new URLSearchParams(window.location.search);
    const lessonId = parseInt(urlParams.get('lesson')) || 0;

    // If NO lesson ID is passed in the URL, act as the Curriculum Roadmap View!
    if (!lessonId) {
      renderCurriculumView();
    } else {
      renderLessonStudyView(lessonId);
    }

    // ==========================================
    // 1. CURRICULUM ROADMAP MODE (When no ?lesson= is provided)
    // ==========================================
    function renderCurriculumView() {
      document.getElementById('back-link-element').href = 'dashboard.html';
      document.getElementById('back-link-element').textContent = '← Back to Dashboard';

      const curriculumBlueprint = [
        {
          unitNumber: 1,
          title: "Linear Equations, Inequalities & Functions",
          lessons: [
            { id: 101, title: "Write and Solve One-Variable Linear Equations" },
            { id: 102, title: "Write and Solve One-Variable Linear Inequalities" },
            { id: 103, title: "Solve Linear Equations for a Specific Variable" },
            { id: 104, title: "Write Two-Variable Linear Equations in Various Forms" },
            { id: 105, title: "Write and Solve Direct Variation Equations" },
            { id: 106, title: "Write Equations of Parallel and Perpendicular Lines" },
            { id: 107, title: "Determine the Domain and Range of a Function" },
            { id: 108, title: "Evaluate Functions Given Elements of Their Domains" },
            { id: 109, title: "🏆 Unit 1 Mastery Test" }
          ]
        }
      ];

      const completedLessons = JSON.parse(localStorage.getItem('mindly_completed_lessons') || '[]');
      let totalLessonsCount = 0;
      let completedCount = 0;
      let previousLessonCompleted = true;

      let html = `
        <div class="curriculum-header" style="margin-bottom: 2rem;">
          <h1>Algebra 1 Curriculum</h1>
          <p>Master linear equations, inequalities, functions, and parallel/perpendicular lines step-by-step.</p>
          <div class="progress-bar-container" style="background: rgba(15, 15, 20, 0.8); border-radius: 10px; height: 10px; width: 100%; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);">
            <div class="progress-fill" id="progress-fill" style="width: 0%; background: linear-gradient(135deg, #8b5cf6, #ec4899); height: 100%;"></div>
          </div>
          <div class="progress-text" style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #d4d4d8; margin-top: 0.5rem;">
            <span id="progress-label">0 of 9 Lessons Completed</span>
            <span id="progress-percent">0% Complete</span>
          </div>
        </div>
        <div class="units-list" id="units-list"></div>
      `;

      document.querySelector('.lesson-container').innerHTML = `
        <div class="lesson-top-bar hide-in-focus">
          <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
          <button class="focus-toggle-btn" onclick="toggleFocusMode()">✨ Toggle Deep Focus Mode</button>
        </div>
        <div class="lesson-card">${html}</div>
      `;

      const unitsListContainer = document.getElementById('units-list');

      curriculumBlueprint.forEach(unit => {
        const unitCard = document.createElement('div');
        unitCard.style.cssText = "display: flex; flex-direction: column; gap: 1rem;";

        let lessonsHTML = '';
        unit.lessons.forEach(lesson => {
          totalLessonsCount++;
          let status = 'locked';
          let badgeClass = 'background: rgba(255,255,255,0.05); color: #71717a; border: 1px solid rgba(255,255,255,0.05);';
          let badgeText = 'Locked 🔒';
          let icon = '🔒';

          if (completedLessons.includes(lesson.id)) {
            status = 'completed';
            badgeClass = 'background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4);';
            badgeText = 'Completed ✓';
            icon = '✅';
            completedCount++;
            previousLessonCompleted = true;
          } else if (previousLessonCompleted) {
            status = 'available';
            badgeClass = 'background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.4);';
            badgeText = 'Start Lesson 🚀';
            icon = '📖';
            previousLessonCompleted = false;
          }

          lessonsHTML += `
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1.25rem; background: rgba(15, 15, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; cursor: pointer; transition: all 0.2s ease;" onclick="handleLessonClick(${lesson.id}, '${status}')" onmouseover="this.style.background='rgba(192,132,252,0.15)'" onmouseout="this.style.background='rgba(15,15,20,0.6)'">
              <div style="display: flex; align-items: center; gap: 1rem;">
                <span style="font-size: 1.1rem;">${icon}</span>
                <span style="color: #f4f4f5; font-size: 0.95rem; font-weight: 500;">${lesson.title}</span>
              </div>
              <span style="font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0.75rem; border-radius: 8px; ${badgeClass}">${badgeText}</span>
            </div>
          `;
        });

        unitCard.innerHTML = `
          <div style="font-size: 1.25rem; font-weight: 700; color: #ffffff; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.75rem;">
            <span style="background: rgba(192, 132, 252, 0.2); color: #c084fc; font-size: 0.8rem; padding: 0.25rem 0.6rem; border-radius: 20px; border: 1px solid rgba(192, 132, 252, 0.4);">Unit ${unit.unitNumber}</span>
            ${unit.title}
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.75rem;">${lessonsHTML}</div>
        `;
        unitsListContainer.appendChild(unitCard);
      });

      const percent = totalLessonsCount > 0 ? Math.round((completedCount / totalLessonsCount) * 100) : 0;
      document.getElementById('progress-fill').style.width = `${percent}%`;
      document.getElementById('progress-label').textContent = `${completedCount} of ${totalLessonsCount} Lessons Completed`;
      document.getElementById('progress-percent').textContent = `${percent}% Complete`;
    }

    function handleLessonClick(id, status) {
      if (status === 'locked') {
        alert('Complete the previous lesson first to unlock this topic!');
        return;
      }
      window.location.href = `quiz.html?lesson=${id}`;
    }


    // ==========================================
    // 2. LESSON STUDY & 15-QUESTION QUIZ ENGINE
    // ==========================================
    const lessonsRepo = {
      101: {
        title: "Write and Solve One-Variable Linear Equations",
        content: `
          <p>A <strong>linear equation</strong> in one variable can be written in the standard form $ax + b = 0$. Isolate the variable using inverse operations.</p>
          <div class="example-box">Example: Solve $4x - 8 = 16 \\rightarrow 4x = 24 \\rightarrow x = 6$</div>
        `,
        questions: generateSimulatedQuestions("One-Variable Linear Equations", 15)
      },
      102: {
        title: "Write and Solve One-Variable Linear Inequalities",
        content: `
          <p>Linear inequalities use $<, >, \\leq, \\geq$. Remember to <strong>flip the inequality sign</strong> whenever you multiply or divide both sides by a negative number.</p>
          <div class="example-box">Example: $-3x > 12 \\rightarrow x < -4$</div>
        `,
        questions: generateSimulatedQuestions("One-Variable Linear Inequalities", 15)
      },
      103: {
        title: "Solve Linear Equations for a Specific Variable",
        content: `
          <p>Literal equations contain multiple variables. Treat other variables as constants while isolating the target variable.</p>
          <div class="example-box">Example: Solve $ax + by = c$ for $y \\rightarrow by = c - ax \\rightarrow y = \\frac{c - ax}{b}$</div>
        `,
        questions: generateSimulatedQuestions("Literal Equations", 15)
      },
      104: {
        title: "Write Two-Variable Linear Equations in Various Forms",
        content: `
          <p>Key forms include Slope-Intercept ($y = mx + b$), Point-Slope ($y - y_1 = m(x - x_1)$), and Standard Form ($Ax + By = C$).</p>
        `,
        questions: generateSimulatedQuestions("Two-Variable Linear Equations", 15)
      },
      105: {
        title: "Write and Solve Direct Variation Equations",
        content: `
          <p>Direct variation represents a constant proportional relationship modeled by the equation $y = kx$, where $k$ is the constant of proportionality.</p>
        `,
        questions: generateSimulatedQuestions("Direct Variation", 15)
      },
      106: {
        title: "Write Equations of Parallel and Perpendicular Lines",
        content: `
          <p>Parallel lines share the <strong>exact same slope</strong> ($m_1 = m_2$). Perpendicular lines have <strong>negative reciprocal slopes</strong> ($m_1 \\cdot m_2 = -1$).</p>
        `,
        questions: generateSimulatedQuestions("Parallel & Perpendicular Lines", 15)
      },
      107: {
        title: "Determine the Domain and Range of a Function",
        content: `
          <p><strong>Domain</strong> represents all valid input values ($x$-values), while <strong>Range</strong> represents all resulting output values ($y$-values).</p>
        `,
        questions: generateSimulatedQuestions("Domain and Range", 15)
      },
      108: {
        title: "Evaluate Functions Given Elements of Their Domains",
        content: `
          <p>To evaluate a function $f(x)$ for a given element, substitute that value into every instance of $x$ in the function rule and simplify.</p>
        `,
        questions: generateSimulatedQuestions("Evaluating Functions", 15)
      },
      109: {
        title: "🏆 Unit 1 Mastery Test",
        content: `
          <p>This capstone test covers comprehensive cumulative concepts from all Unit 1 topics regarding linear equations, inequalities, and functions.</p>
        `,
        questions: generateSimulatedQuestions("Unit 1 Comprehensive Mastery", 15)
      }
    };

    function renderLessonStudyView(id) {
      const lesson = lessonsRepo[id] || {
        title: "Algebra Lesson",
        content: "<p>Detailed study materials and problem walkthroughs.</p>",
        questions: generateSimulatedQuestions("Algebra", 15)
      };

      document.getElementById('lesson-title').textContent = lesson.title;
      document.getElementById('lesson-body').innerHTML = lesson.content;
    }

    // Generator for 15 robust practice questions per lesson
    function generateSimulatedQuestions(topic, count) {
      const qList = [];
      for (let i = 1; i <= count; i++) {
        qList.push({
          question: `(${topic}) Practice Question ${i}: Which of the following accurately describes or solves the core principle for problem variant #${i}?`,
          options: [
            `Option A: Standard computed value for variant ${i}`,
            `Option B: Correct target solution for ${topic} (${i * 2})`,
            `Option C: Inverted sign calculation error`,
            `Option D: Undefined parameter solution`
          ],
          correctAnswer: `Option B: Correct target solution for ${topic} (${i * 2})`
        });
      }
      return qList;
    }

    let currentQuizQuestions = [];
    let currentIdx = 0;
    let userAnswers = [];

    function startQuiz() {
      const lesson = lessonsRepo[lessonId];
      currentQuizQuestions = lesson ? lesson.questions : generateSimulatedQuestions("Algebra", 15);
      userAnswers = Array(currentQuizQuestions.length).fill(null);

      document.getElementById('study-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'flex';
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuizQuestions[currentIdx];
      document.getElementById('question-text').textContent = q.question;
      document.getElementById('progress-indicator').textContent = `Question ${currentIdx + 1} of ${currentQuizQuestions.length}`;

      const optionsGroup = document.getElementById('options-group');
      optionsGroup.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        if (userAnswers[currentIdx] === opt) btn.classList.add('selected');
        btn.textContent = opt;
        btn.onclick = () => {
          document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          userAnswers[currentIdx] = opt;
        };
        optionsGroup.appendChild(btn);
      });

      document.getElementById('prev-btn').style.display = currentIdx > 0 ? 'block' : 'none';
      document.getElementById('next-btn').textContent = currentIdx === currentQuizQuestions.length - 1 ? 'Finish Quiz' : 'Next Question';
    }

    function nextQuestion() {
      if (userAnswers[currentIdx] === null) {
        alert('Please select an answer before proceeding.');
        return;
      }
      if (currentIdx < currentQuizQuestions.length - 1) {
        currentIdx++;
        loadQuestion();
      } else {
        showResults();
      }
    }

    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        loadQuestion();
      }
    }

    function showResults() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('results-view').style.display = 'flex';

      let score = 0;
      const summaryList = document.getElementById('summary-list');
      summaryList.innerHTML = '';

      currentQuizQuestions.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const isCorrect = userAns === q.correctAnswer;
        if (isCorrect) score++;

        const item = document.createElement('div');
        item.className = `summary-item ${isCorrect ? 'correct' : 'incorrect'}`;
        item.innerHTML = `
          <p style="font-weight:600; margin-bottom: 0.3rem; font-size:0.95rem;">Q${idx+1}: ${q.question}</p>
          <p style="font-size: 0.85rem; color: ${isCorrect ? '#34d399' : '#f87171'}">Your Answer: ${userAns}</p>
          <p style="font-size: 0.85rem; color: #34d399;">Correct Answer: ${q.correctAnswer}</p>
        `;
        summaryList.appendChild(item);
      });

      document.getElementById('score-summary').textContent = `You scored ${score} out of ${currentQuizQuestions.length} correct!`;
    }

    function handleSpacedRepetition(rating) {
      let reviewSchedules = JSON.parse(localStorage.getItem('mindly_spaced_repetition') || '{}');
      const now = new Date();
      const daysToAdd = rating === 'good' ? 4 : 1;
      const nextReviewDate = new Date(now.setDate(now.getDate() + daysToAdd));

      reviewSchedules[lessonId] = {
        lastReviewed: new Date().toISOString(),
        nextReview: nextReviewDate.toISOString(),
        interval: daysToAdd
      };
      localStorage.setItem('mindly_spaced_repetition', JSON.stringify(reviewSchedules));

      // Mark lesson as completed in curriculum progress tracker
      let completedLessons = JSON.parse(localStorage.getItem('mindly_completed_lessons') || '[]');
      if (!completedLessons.includes(lessonId)) {
        completedLessons.push(lessonId);
        localStorage.setItem('mindly_completed_lessons', JSON.stringify(completedLessons));
      }

      alert(`Great job! Spaced repetition scheduled your next review in ${daysToAdd} day(s). Returning to curriculum...`);
      window.location.href = 'quiz.html';
    }

    function toggleFocusMode() {
      document.getElementById('lesson-wrapper').classList.toggle('focus-mode');
    }
  </script>
</body>
</html>
